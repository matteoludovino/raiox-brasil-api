# Render Blueprint (free plan). Create it from the dashboard: New > Blueprint > this repo.
# Redis is external (Upstash free plan): fill RAIOX_REDIS_URL with its rediss:// URL.
services:
  - type: web
    name: raiox-brasil-api
    runtime: docker
    plan: free            # sleeps after inactivity: the first request after idle is slow
    region: virginia      # same region as the Upstash database (us-east-1): Redis latency
                          # dominates, since each request runs several Redis commands
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT         # tells Render which port the container listens on
        value: "8000"
      - key: RAIOX_ENV
        value: prod       # refuses to boot with a weak admin token
      - key: RAIOX_LOG_JSON
        value: "true"
      - key: RAIOX_ADMIN_TOKEN
        generateValue: true   # random 256-bit value generated by Render
      - key: RAIOX_REDIS_URL
        sync: false           # set in the dashboard (secret)
      - key: RAIOX_DEMO_API_KEY
        sync: false           # set in the dashboard: rx_live_ + random chars
